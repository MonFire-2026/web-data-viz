<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MonFire - Cadastro</title>
  <link rel="stylesheet" href="./css/global.css">
  <link rel="stylesheet" href="./css/cadastro.css">
  <link rel="shortcut icon" href="./assets/icon/LogoMonfire.png" type="image/x-icon">
  <script src="./js/navbar.js" defer></script>
</head>

<body class="paginaCadastro">
  <header>
    <div class="conteinerHeader">
      <div class="conteinerLogoHeader">
        <a href="./index.html"><img src="./assets/icon/LogoMonfire.png" alt="logo"></a>
        <h1>Mon<span>Fire</span></h1>
      </div>
      <nav id="menuLinksHeader">
        <ul>
              <li><a href="#sessaoRecursos">Recursos</a></li>
                    <li><a href="#sessaoBeneficios">Benefícios</a></li>
                    <li><a href="#sessaoImpacto">Notícias</a></li>
                    <li><a href="./sobreNos.html">Sobre Nós</a></li>
          <div id="conteinerAcoesResponsivas">
            <ul id="conteinerMenuLogar">
              <li><a href="./login.html">Entre</a></li>
              <li><a class="nav-pagina-atual" aria-current="page" href="./cadastro.html">Cadastre-se</a></li>
            </ul>
          </div>
        </ul>
      </nav>
      <div class="conteinerBotoesHeader">
        <a href="./login.html" class="botaoLogin">Entrar</a>
        <a href="./cadastro.html" class="botaoCadastro nav-pagina-atual" aria-current="page">Cadastre-se</a>
      </div>
      <div class="conteinerMenuResponsivo">
        <button class="botaoMenu" type="button" aria-label="Abrir menu de navegação"
          aria-controls="menuLinksHeader" aria-expanded="false" onclick="mostrarMenu()">
          <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="currentColor"
            class="bi bi-list" viewBox="0 0 16 16">
            <path fill-rule="evenodd"
              d="M2.5 12a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5" />
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main class="conteudoAutenticacao">
    <div class="cardCadastro">
    <div class="cabecalhoCadastro">
      <h2>Criar conta</h2>
      <p>Preencha os dados para acessar o sistema</p>
    </div>

    <div class="formularioCadastro">

      <div class="campoCadastro">
        <label for="nome_input">NOME COMPLETO <span>*</span></label>
        <input type="text" id="nome_input" placeholder="Nome e sobrenome">
      </div>

      <div class="campoCadastro">
        <label for="email_input">E-MAIL <span>*</span></label>
        <input type="email" id="email_input" placeholder="usuario@provedor.com">
      </div>

      <div class="campoCadastro">
        <label for="codigo_input">ID DA EMPRESA <span>*</span></label>
        <input type="number" id="codigo_input" min="1" placeholder="Ex.: 2">
      </div>

      <div class="campoCadastro">
        <label for="cargo_input">SEU CARGO <span>*</span></label>
        <select id="cargo_input">
          <option value="">Selecione...</option>
          <option value="Gerente">Gerente</option>
          <option value="Técnico">Técnico</option>
          <option value="Comum">Comum</option>
        </select>
      </div>

      <div class="campoCadastro">
        <label for="senha_input">SENHA <span>*</span></label>
        <div class="campoSenha">
          <input type="password" id="senha_input" placeholder="Usuario123@" minlength="8" maxlength="64"
            autocomplete="new-password" aria-describedby="requisitos_senha">

        </div>
        <small id="requisitos_senha" class="requisitosSenha">
          Use de 8 a 64 caracteres, com letra maiúscula, minúscula, número e símbolo, sem espaços.
        </small>
      </div>

      <div class="campoCadastro">
        <label for="confirmacao_senha_input">CONFIRMAR SENHA <span>*</span></label>
        <div class="campoSenha">
          <input type="password" id="confirmacao_senha_input"
            placeholder="Repita a senha digitada anteriormente" minlength="8" maxlength="64"
            autocomplete="new-password">

        </div>
      </div>

      <button type="button" class="botaoCriarConta" onclick="cadastrar()">Criar conta</button>
    </div>

    <div class="rodapeCadastro"><span>Já tem acesso? </span><a href="login.html">Entrar na conta</a></div>

    </div>
  </main>
</body>

</html>

<script>
  function validarSenha(senha) {
    if (senha.length < 8 || senha.length > 64) {
      return "A senha deve possuir entre 8 e 64 caracteres.";
    }

    if (/\s/.test(senha)) {
      return "A senha não pode conter espaços.";
    }

    if (!/[a-z]/.test(senha)) {
      return "A senha deve possuir pelo menos uma letra minúscula.";
    }

    if (!/[A-Z]/.test(senha)) {
      return "A senha deve possuir pelo menos uma letra maiúscula.";
    }

    if (!/[0-9]/.test(senha)) {
      return "A senha deve possuir pelo menos um número.";
    }

    if (!/[^A-Za-z0-9\s]/.test(senha)) {
      return "A senha deve possuir pelo menos um símbolo.";
    }

    return null;
  }

  function cadastrar() {
    var nomeVar = nome_input.value.trim();
    var emailVar = email_input.value.trim();
    var senhaVar = senha_input.value;
    var confirmacaoSenhaVar = confirmacao_senha_input.value;
    var cargoVar = cargo_input.value;
    var codigoVar = Number(codigo_input.value);

    if (!nomeVar || !emailVar || !senhaVar || !confirmacaoSenhaVar || !cargoVar || !codigoVar) {
      alert("Preencha todos os campos.");
      return false;
    }

    if (senhaVar != confirmacaoSenhaVar) {
      alert("As senhas devem ser iguais.");
      return false;
    }

    var erroSenha = validarSenha(senhaVar);

    if (erroSenha) {
      alert(erroSenha);
      return false;
    }

    fetch("/usuarios/cadastrar", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        nomeServer: nomeVar,
        emailServer: emailVar,
        senhaServer: senhaVar,
        confirmacaoSenhaServer: confirmacaoSenhaVar,
        cargoServer: cargoVar,
        codigoServer: codigoVar
      })
    }).then(function (resposta) {
      if (resposta.ok) {
        alert("Cadastro realizado com sucesso.");
        window.location.href = "login.html";
      } else {
        resposta.text().then(function (mensagem) {
          alert(mensagem);
        });
      }
    }).catch(function (erro) {
      console.error(erro);
      alert("Não foi possível conectar ao servidor.");
    });

    return false;
  }
</script>
