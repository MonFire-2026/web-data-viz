<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MonFire | Visão Geral</title>
    <link rel="shortcut icon" href="../assets/icon/favicon2.ico" type="image/x-icon">

    <link rel="stylesheet" href="./../css/dashboard.css">

    <script src="../js/sessao.js"></script>
    <script src="./../js/alerta.js"></script>


    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>


    <script src="https://kit.fontawesome.com/9f7414eb10.js" crossorigin="anonymous"></script>

    <style>
        .seletor-servidor { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
        .btn-servidor {
            padding: 6px 14px; border-radius: 6px; cursor: pointer;
            border: 1px solid #1a2438; background: #fff; color: #1a2438;
            font-family: inherit; font-size: 13px;
        }
        .btn-servidor.ativo { background: #1a2438; color: #fff; }
        .aviso-captura { margin-top: 8px; font-size: 12px; color: #d62222; min-height: 16px; }
    </style>
</head>

<body>

    <aside class="sidebar">
        <div class="brand">
            <div class="brand-logo"><i class="fa-solid fa-fire"></i></div>
            <span class="brand-name">Mon<span>Fire</span></span>
        </div>

        <nav class="nav">
            <a href="../dashboard/dashboard.html" class="ativo">Visão Geral</a>
            <a href="../dashboard/visaoEspecifica.html">Visão Específica</a>
            <a href="../dashboard/usuarios.html">Usuários</a>
            <a href="../dashboard/maquinas.html">Máquinas</a>
            <a href="../dashboard/alertas.html">Alertas</a>
        </nav>

        <button class="btn-sair" type="button" onclick="limparSessao()">Sair</button>
    </aside>

    <main class="conteudo">
        <header class="topo">
            <h1>Visão Geral</h1>
            <p>Resumo do consumo de hardware dos servidores da unidade.</p>
            <p>Olá, <strong id="nome_usuario"></strong></p>
        </header>
        <div id="alerta"></div>

        <section class="kpis">
            <div class="kpi">
                <div class="kpi-valor" id="kpiServidores">47</div>
                <div class="kpi-rotulo">Total de servidores</div>
            </div>
            <div class="kpi">
                <div class="kpi-valor" id="kpiCpu">68%</div>
                <div class="kpi-rotulo">Porcentagem atual da CPU</div>
            </div>
            <div class="kpi destaque">
                <div class="kpi-valor" id="kpiAlertas">5</div>
                <div class="kpi-rotulo">Alertas em aberto</div>
            </div>
        </section>

        <section class="graficos">
            <div class="painel">
                <h2>Gráfico de consumo geral</h2>
                <div class="seletor-servidor" id="seletorServidor"></div>
                <div class="area-grafico">
                    <canvas id="graficoConsumo"></canvas>
                </div>
                <p class="aviso-captura" id="avisoCaptura"></p>
            </div>

            <div class="painel">
                <h2>Gráfico de incidentes</h2>
                <div class="area-grafico">
                    <canvas id="graficoIncidentes"></canvas>
                </div>
            </div>
        </section>
    </main>

</body>

</html>

<script>
    nome_usuario.innerHTML = sessionStorage.NOME_USUARIO;

    const NAVY = '#1a2438';
    const VERMELHO = '#d62222';
    const CINZA = '#8a94a6';

    const DADOS_ESTATICOS = [
        ['10:00', 32, 45, 38], ['10:05', 35, 47, 38], ['10:10', 41, 50, 39],
        ['10:15', 40, 55, 39], ['10:20', 48, 54, 40], ['10:25', 55, 58, 41],
        ['10:30', 52, 62, 41], ['10:35', 60, 64, 42], ['10:40', 63, 66, 43],
        ['10:45', 61, 70, 43], ['10:50', 68, 71, 44], ['10:55', 68, 74, 45]
    ].map(l => ({ momento_grafico: l[0], cpu: l[1], ram: l[2], disco: l[3] }));

    let proximaAtualizacao;
    let servidorAtual;   // servidor que está sendo exibido
    let dados;           // dados do gráfico de consumo
    let myChart;         // gráfico de consumo

    window.onload = exibirAquariosDoUsuario;

    function exibirAquariosDoUsuario() {
        var aquarios = [];
if (sessionStorage.AQUARIOS != undefined) {
    aquarios = JSON.parse(sessionStorage.AQUARIOS);
}
        if (aquarios.length == 0) {
            document.getElementById("seletorServidor").style.display = 'none';
            plotarGrafico(DADOS_ESTATICOS, null);
            return;
        }

        aquarios.forEach(item => {
            document.getElementById("seletorServidor").innerHTML += `
                <button class="btn-servidor" id="btnAquario${item.id}" onclick="exibirAquario(${item.id})">${item.descricao}</button>
            `
        });

        document.getElementById("kpiServidores").innerHTML = aquarios.length;

        if (aquarios.length > 0) {
            exibirAquario(aquarios[0].id)
        }
    }

    function exibirAquario(idAquario) {
        servidorAtual = idAquario;
        let botoes = document.querySelectorAll(".btn-servidor");
        for (let i = 0; i < botoes.length; i++) {
            botoes[i].classList.remove("ativo");
        }
        document.getElementById(`btnAquario${idAquario}`).classList.add("ativo");

        obterDadosGrafico(idAquario);
    }
    function obterDadosGrafico(idAquario) {

        if (proximaAtualizacao != undefined) {
            clearTimeout(proximaAtualizacao);
        }

        fetch(`/medidas/ultimas/${idAquario}`, { cache: 'no-store' }).then(function (response) {
            if (response.ok) {
                response.json().then(function (resposta) {
                    console.log(`Dados recebidos: ${JSON.stringify(resposta)}`);
                    resposta.reverse();

                    if (resposta.length == 0 || resposta[0].cpu === undefined) {
                        plotarGrafico(DADOS_ESTATICOS, null);
                    } else {
                        plotarGrafico(resposta, idAquario);
                    }

                });
            } else {
                console.error('Nenhum dado encontrado ou erro na API');
                plotarGrafico(DADOS_ESTATICOS, null);
            }
        })
            .catch(function (error) {
                console.error(`Erro na obtenção dos dados p/ gráfico: ${error.message}`);
                plotarGrafico(DADOS_ESTATICOS, null);
            });
    }

    function plotarGrafico(resposta, idAquario) {

        console.log('iniciando plotagem do gráfico...');

        dados = {
            labels: [],
            datasets: [
                { label: 'CPU', data: [], borderColor: NAVY, backgroundColor: NAVY, borderWidth: 3, tension: 0.35, pointRadius: 2 },
                { label: 'RAM', data: [], borderColor: VERMELHO, backgroundColor: VERMELHO, borderWidth: 2, tension: 0.35, pointRadius: 2 },
                { label: 'Disco', data: [], borderColor: CINZA, backgroundColor: CINZA, borderWidth: 2, tension: 0.35, pointRadius: 2 }
            ]
        };

        for (i = 0; i < resposta.length; i++) {
            var registro = resposta[i];
            dados.labels.push(registro.momento_grafico);
            dados.datasets[0].data.push(registro.cpu);
            dados.datasets[1].data.push(registro.ram);
            dados.datasets[2].data.push(registro.disco);
        }

        console.log('O gráfico será plotado com os respectivos valores:')
        console.log(dados)

        if (myChart) {
            myChart.destroy();
        }

        myChart = new Chart(document.getElementById('graficoConsumo'), {
            type: 'line',
            data: dados,
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { position: 'bottom', labels: { usePointStyle: true, padding: 20 } }
                },
                scales: {
                    y: {
                        min: 0,
                        max: 100,
                        title: { display: true, text: 'Uso (%)' },
                        grid: { color: '#e2e5ea' }
                    },
                    x: { grid: { display: false } }
                }
            }
        });

        atualizarKpiCpu();

        if (idAquario !== null) {
            proximaAtualizacao = setTimeout(() => atualizarGrafico(idAquario), 2000);
        }
    }

    function atualizarGrafico(idAquario) {

        if (idAquario != servidorAtual) {
            return;
        }

        fetch(`/medidas/tempo-real/${idAquario}`, { cache: 'no-store' }).then(function (response) {
            if (response.ok) {
                response.json().then(function (novoRegistro) {

                    obterdados(idAquario);
                    console.log(`Dados recebidos: ${JSON.stringify(novoRegistro)}`);
                    console.log(`Dados atuais do gráfico:`);
                    console.log(dados);

                    let avisoCaptura = document.getElementById('avisoCaptura')
                    avisoCaptura.innerHTML = ""

                    if (novoRegistro[0].momento_grafico == dados.labels[dados.labels.length - 1]) {
                        console.log("Como não há dados novos para captura, o gráfico não atualizará.")
                        avisoCaptura.innerHTML = "<i class='fa-solid fa-triangle-exclamation'></i> Foi trazido o dado mais atual capturado pelo sensor. Como não há dados novos a exibir, o gráfico não atualizará."
                    } else {
                        dados.labels.shift(); 
                        dados.labels.push(novoRegistro[0].momento_grafico);

                        dados.datasets[0].data.shift();
                        dados.datasets[0].data.push(novoRegistro[0].cpu);

                        dados.datasets[1].data.shift();
                        dados.datasets[1].data.push(novoRegistro[0].ram);

                        dados.datasets[2].data.shift();
                        dados.datasets[2].data.push(novoRegistro[0].disco);

                        myChart.update();
                        atualizarKpiCpu();
                    }

                    proximaAtualizacao = setTimeout(() => atualizarGrafico(idAquario), 2000);
                });
            } else {
                console.error('Nenhum dado encontrado ou erro na API');
                proximaAtualizacao = setTimeout(() => atualizarGrafico(idAquario), 2000);
            }
        })
            .catch(function (error) {
                console.error(`Erro na obtenção dos dados p/ gráfico: ${error.message}`);
            });

    }

    function atualizarKpiCpu() {
        let cpu = dados.datasets[0].data;
        let ultimo = cpu[cpu.length - 1];
        if (ultimo !== undefined) {
            document.getElementById('kpiCpu').innerHTML = ultimo + '%';
        }
    }

    new Chart(document.getElementById('graficoIncidentes'), {
        type: 'doughnut',
        data: {
            labels: ['CPU', 'RAM', 'Disco'],
            datasets: [{
                data: [9, 14, 5],
                backgroundColor: [NAVY, VERMELHO, CINZA],
                borderColor: '#ffffff',
                borderWidth: 4
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            cutout: '60%',
            plugins: {
                legend: { position: 'bottom', labels: { usePointStyle: true, padding: 20 } }
            }
        }
    });
</script>
