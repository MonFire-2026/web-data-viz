<!DOCTYPE html>
<html lang="pt-br">

<head>
    <link rel="shortcut icon" href="../assets/icon/favicon2.ico" type="image/x-icon">
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MonFire | Visão Específica</title>

    <link rel="stylesheet" href="./../css/dashboard.css">


    <script src="../js/sessao.js"></script>
    <script src="../js/alerta.js"></script>


    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>


    <script src="https://kit.fontawesome.com/9f7414eb10.js" crossorigin="anonymous"></script>

    <style>
        .perigo-frio { background: #1f4e9c; }
        .alerta-frio { background: #6aa7e0; }
        .ideal { background: #1b7a43; }
        .alerta-quente { background: #e0a100; }
        .perigo-quente { background: #d62222; }

        .parametros-alerta { display: flex; flex-wrap: wrap; gap: 8px; }
        .item-regua {
            flex: 1; min-width: 110px; padding: 10px; border-radius: 8px;
            text-align: center; color: #fff; font-size: 14px;
        }
        .item-regua p { margin: 0; }

        .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
        .card-aquario {
            padding: 16px; border: 1px solid #e2e5ea; border-left: 6px solid #1a2438; border-radius: 8px;
        }
        .title-aquario h1 { margin: 0 0 12px; font-size: 16px; color: #1a2438; }
        .desc-aquario { display: flex; align-items: center; justify-content: space-between; }
        .temperatura p { margin: 0; font-size: 28px; font-weight: 700; color: #1a2438; }
        .cor-alerta { width: 28px; height: 28px; border-radius: 50%; background: #e2e5ea; }
    </style>
</head>

<body class="pagina-cards" onload="exibirAquarios(), atualizacaoPeriodica()">

    <aside class="sidebar">
        <div class="brand">
            <div class="brand-logo"><i class="fa-solid fa-fire"></i></div>
            <span class="brand-name">Mon<span>Fire</span></span>
        </div>

        <nav class="nav">
            <a href="../dashboard/dashboard.html">Visão Geral</a>
            <a href="../dashboard/visaoEspecifica.html" class="ativo">Visão Específica</a>
            <a href="../dashboard/usuarios.html">Usuários</a>
            <a href="../dashboard/maquinas.html">Máquinas</a>
            <a href="../dashboard/alertas.html">Alertas</a>
        </nav>

        <button class="btn-sair" type="button" onclick="limparSessao()">Sair</button>
    </aside>

    <main class="conteudo">
        <header class="topo">
            <h1>Visão Específica</h1>
            <p>Monitoramento detalhado dos componentes de hardware do sistema 193 – Corpo de Bombeiros.</p>
            <p>Olá, <strong id="b_usuario">usuário</strong>!</p>
        </header>

        <div id="alerta"></div>

        <section class="painel" style="margin-top:28px">
            <h2>Consumo por componente</h2>
            <div class="filtros" id="filtros"></div>
            <div class="area-grafico">
                <canvas id="cGrafico"></canvas>
            </div>
            <div class="resumo" id="resumo"></div>
        </section>

        <section class="painel">
            <h2>Servidores do sistema 193</h2>
            <div class="tabela-wrap" id="tab"></div>
        </section>

        <section class="painel">
            <div class="cards" id="cardAquarios">

            </div>
        </section>
    </main>

</body>

<script>

    function exibirAquarios() {
        JSON.parse(sessionStorage.AQUARIOS).forEach(item => {
            document.getElementById("cardAquarios").innerHTML += `
                    <div class="card-aquario">
                        <div class="title-aquario">
                            <h1>${item.descricao}</h1>
                        </div>
                        <div class="desc-aquario">
                        <div class="temperatura">
                            <p id="temp_aquario_${item.id}">-°C</p>
                        </div>
                        <div class="cor-alerta" id="card_${item.id}"></div>
                    </div>
                    </div>
                    `
        });
    }

    const NAVY = '#1a2438';
    const VERMELHO = '#d62222';
    const CINZA = '#8a94a6';
    const AMBAR = '#e0a100';
    const CORES = [NAVY, VERMELHO, CINZA, AMBAR];

    Chart.defaults.font.family = "'Segoe UI', Tahoma, sans-serif";
    Chart.defaults.color = '#5a6b85';

    const HORAS = ['10:00', '10:05', '10:10', '10:15', '10:20', '10:25', '10:30', '10:35', '10:40', '10:45', '10:50', '10:55'];
    const COMPONENTES = ['CPU', 'RAM', 'Disco', 'Rede'];

    function serie(a, b, s) {
        let valores = [];

        for (let i = 0; i < HORAS.length; i++) {
            let valor = Math.round(a + (b - a) * i / 11 + Math.sin(i * s) * 2);
            valores.push(Math.min(100, valor));
        }

        return valores;
    }

    const SERVIDORES = [
        { nome: 'SRV-193-CAD-01', funcao: 'Responsável pelas ocorrências',  dados: { CPU: serie(55, 72, 1.3), RAM: serie(60, 78, 2.1), Disco: serie(40, 42, .7), Rede: serie(30, 45, 1.7) } },
        { nome: 'SRV-193-CDA-02',  funcao: 'Responsável pelo Banco de dados',           dados: { CPU: serie(50, 66, .9),  RAM: serie(70, 84, 1.9), Disco: serie(84, 92, .5), Rede: serie(25, 35, 2.3) } },
        { nome: 'SRV-193-CAD-03', funcao: 'Responsável pela geolocalização',   dados: { CPU: serie(35, 44, 1.1), RAM: serie(48, 55, 2.5), Disco: serie(55, 57, .6), Rede: serie(40, 58, 1.4) } },
        { nome: 'SRV-193-CAD-04', funcao: 'Responsável pela sTelefonia 193', dados: { CPU: serie(60, 91, 1.6), RAM: serie(52, 60, .8),  Disco: serie(62, 66, 1.2), Rede: serie(48, 70, 2.0) } }
    ];

    function valorAtual(servidor, componente) {
        return servidor.dados[componente][11];
    }
    function nivel(valor) {
        if (valor >= 90) {
            return 'Crítico';
        } else if (valor >= 75) {
            return 'Atenção';
        } else {
            return 'Normal';
        }
    }
    function selo(situacao) {
        let classe = 'ok';

        if (situacao == 'Atenção') {
            classe = 'atencao';
        } else if (situacao == 'Crítico') {
            classe = 'critico';
        }

        return `<span class="selo ${classe}">${situacao}</span>`;
    }
    const graficoComponentes = new Chart(document.getElementById('cGrafico'), {
        type: 'line',
        data: { labels: HORAS, datasets: [] },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: { position: 'bottom', labels: { usePointStyle: true, padding: 20 } }
            },
            scales: {
                y: { min: 0, max: 100, title: { display: true, text: 'Uso (%)' }, grid: { color: '#e2e5ea' } },
                x: { grid: { display: false } }
            }
        }
    });

    function mostrar(componente) {

        let botoes = document.querySelectorAll('.chip');
        for (let i = 0; i < botoes.length; i++) {
            if (botoes[i].textContent == componente) {
                botoes[i].classList.add('ativo');
            } else {
                botoes[i].classList.remove('ativo');
            }
        }

        let linhas = [];
        let valores = [];

        for (let i = 0; i < SERVIDORES.length; i++) {
            let s = SERVIDORES[i];

            linhas.push({
                label: s.nome.replace('SRV-193-', ''),
                data: s.dados[componente],
                borderColor: CORES[i],
                backgroundColor: CORES[i],
                borderWidth: 2,
                tension: 0.35,
                pointRadius: 2
            });

            valores.push(valorAtual(s, componente));
        }

        graficoComponentes.data.datasets = linhas;
        graficoComponentes.options.scales.y.title.text = 'Uso de ' + componente + ' (%)';
        graficoComponentes.update();


        let maior = 0;
        let posicaoMaior = 0;
        let soma = 0;
        let emAtencao = 0;

        for (let i = 0; i < valores.length; i++) {
            if (valores[i] > maior) {
                maior = valores[i];
                posicaoMaior = i;
            }
            soma += valores[i];
            if (valores[i] >= 75) {
                emAtencao++;
            }
        }

        document.getElementById('resumo').innerHTML = `
            <div><b>${maior}%</b>Maior uso atual (${SERVIDORES[posicaoMaior].nome})</div>
            <div><b>${Math.round(soma / valores.length)}%</b>Média dos servidores</div>
            <div><b>${emAtencao}</b>Servidores em atenção ou crítico</div>
        `;
    }

    function montarFiltros() {
        let botoes = '';

        for (let i = 0; i < COMPONENTES.length; i++) {
            botoes += `<button class="chip" type="button" onclick="mostrar('${COMPONENTES[i]}')">${COMPONENTES[i]}</button>`;
        }

        document.getElementById('filtros').innerHTML = botoes;
    }

    function montarTabela() {
        let linhas = '';

        for (let i = 0; i < SERVIDORES.length; i++) {
            let s = SERVIDORES[i];
            let colunasUso = '';
            let problemas = [];
            let maior = 0;

            for (let j = 0; j < COMPONENTES.length; j++) {
                let valor = valorAtual(s, COMPONENTES[j]);

                colunasUso += `<td>${valor}%</td>`;

                if (valor >= 75) {
                    problemas.push(COMPONENTES[j] + ' ' + valor + '%');
                }
                if (valor > maior) {
                    maior = valor;
                }
            }

            let situacao = nivel(maior);
            let classeLinha = situacao == 'Crítico' ? 'critico' : '';
            let textoProblema = problemas.length > 0 ? problemas.join(' · ') : '—';

            linhas += `
                <tr class="${classeLinha}">
                    <td><b>${s.nome}</b></td>
                    <td>${s.funcao}</td>
                    ${colunasUso}
                    <td>${textoProblema}</td>
                    <td>${selo(situacao)}</td>
                </tr>
            `;
        }

        document.getElementById('tab').innerHTML = `
            <table>
                <thead>
                    <tr>
                        <th>Servidor</th>
                        <th>Função</th>
                        <th>CPU</th>
                        <th>RAM</th>
                        <th>Disco</th>
                        <th>Rede</th>
                        <th>Problema detectado</th>
                        <th>Situação</th>
                    </tr>
                </thead>
                <tbody>${linhas}</tbody>
            </table>
        `;
    }

    montarFiltros();
    mostrar('CPU');
    montarTabela();
</script>

</html>
