<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MonFire - Login</title>
    <link rel="stylesheet" href="./css/estilo.css">
    <link rel="shortcut icon" href="./assets/icon/LogoMonfire.png" type="image/x-icon">

</head>

<body class="paginaCadastro">

    <div class="cardCadastro">
        <a href="./index.html" style="color: #dc2626; text-decoration: none;">x</a>
        <div class="cabecalhoCadastro">
            <h2>Bem-vindo de volta</h2>
            <p>Use suas credenciais institucionais para acessar</p>
        </div>

        <div class="formularioCadastro">

            <div class="campoCadastro">
                <label for="email_input">E-MAIL INSTITUCIONAL <span>*</span></label>
                <input type="text" name="" id="email_input" placeholder="usuario@provedor.com">
            </div>

            <div class="campoCadastro">
                <label for="senha_input">SENHA <span>*</span></label>
                <div class="campoSenha">
                    <input type="password" name="" id="senha_input" placeholder="Usuario123@">

                </div>
            </div>

            <div class="esqueciSenha">
                <a href="">Esqueci minha senha</a>
            </div>

            <button type="button" class="botaoCriarConta" onclick="entrar()">Acessar o sistema</button>

        </div>
        <div class="rodapeCadastro"> <span>Ainda não tem acesso?</span> <a href="cadastro.html">Cadastre-se</a></div>
    </div>

</body>

</html>

<script>



    function entrar() {
        //  aguardar();

        var emailVar = email_input.value;
        var senhaVar = senha_input.value;

        if (emailVar == "" || senhaVar == "") {
            cardErro.style.display = "block"
            mensagem_erro.innerHTML = "(Mensagem de erro para todos os campos em branco)";
            finalizarAguardar();
            return false;
        }
        /*   else {
               setInterval(sumirMensagem, 5000)
           }
               */

        console.log("FORM LOGIN: ", emailVar);
        console.log("FORM SENHA: ", senhaVar);

        fetch("/usuarios/autenticar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                emailServer: emailVar,
                senhaServer: senhaVar
            })
        }).then(function (resposta) {
            console.log("ESTOU NO THEN DO entrar()!")

            if (resposta.ok) {
                console.log(resposta);

                resposta.json().then(json => {
                    console.log(json);
                    console.log(JSON.stringify(json));
                    sessionStorage.EMAIL_USUARIO = json.email;
                    sessionStorage.NOME_USUARIO = json.nome;
                    sessionStorage.ID_USUARIO = json.id;
                    sessionStorage.AQUARIOS = JSON.stringify(json.aquarios)

                    // setTimeout(function () {
                    window.location.href = "./dashboard/cards.html";
                    //  }, 1000); // apenas para exibir o loading

                });

            } else {

                console.log("Houve um erro ao tentar realizar o login!");

                resposta.text().then(texto => {
                    console.error(texto);
                    //   finalizarAguardar(texto);
                });
            }

        }).catch(function (erro) {
            console.log(erro);
        })

        return false;
    }

    /*  function sumirMensagem() {
          cardErro.style.display = "none"
      }
          */

</script>
